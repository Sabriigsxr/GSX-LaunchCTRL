<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="monoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#087BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21C8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Monogram: GS + LC intertwined -->
  <!-- Outer circle track -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#111722" stroke-width="4" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#monoGradient)" stroke-width="4" stroke-dasharray="267 267" stroke-dashoffset="67" />
  
  <!-- G -->
  <text x="62" y="115" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="900" fill="#F5F7FA">G</text>
  
  <!-- X signature -->
  <text x="78" y="115" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="900" fill="url(#monoGradient)">X</text>
  
  <!-- LC -->
  <text x="112" y="95" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" fill="#C7D0DC">L</text>
  <text x="138" y="95" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" fill="#F5F7FA">C</text>
</svg>