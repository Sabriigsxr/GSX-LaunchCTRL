<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#087BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21C8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#080B10" rx="6" />
  
  <!-- GSX monogram -->
  <text x="6" y="23" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">GSX</text>
  
  <!-- X signature -->
  <text x="6" y="23" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="url(#favGradient)" letter-spacing="-0.02em">X</text>
</svg>